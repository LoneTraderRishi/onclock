<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d3a2e"/>
      <stop offset="100%" stop-color="#1a2520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d9b8"/>
      <stop offset="100%" stop-color="#c0613b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Coffee cup -->
  <g stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M150 200 H320 V300 Q320 360 235 360 Q150 360 150 300 Z"/>
    <path d="M320 220 Q380 220 380 260 Q380 300 320 300"/>
    <!-- steam -->
    <path d="M195 110 Q205 130 195 150 Q185 170 195 190" opacity="0.7"/>
    <path d="M235 100 Q245 125 235 150 Q225 175 235 200" opacity="0.85"/>
    <path d="M275 110 Q285 130 275 150 Q265 170 275 190" opacity="0.7"/>
  </g>
  <!-- ampersand -->
  <text x="256" y="450" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="80" fill="url(#accent)">&amp;</text>
</svg>
